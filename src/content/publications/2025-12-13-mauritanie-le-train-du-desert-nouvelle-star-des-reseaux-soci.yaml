coulisses: "J'ai observé une tendance sur les réseaux sociaux : des jeunes
  montent dans un train en Mauritanie et se font filmer à l'intérieur. J'ai
  interviewé un jeune passager pour comprendre ses motivations. En enquêtant sur
  ce train, j'ai découvert qu'il s'agit du plus grand train de minerai de
  Mauritanie, et que monter à bord est dangereux et surtout totalement
  interdit."
