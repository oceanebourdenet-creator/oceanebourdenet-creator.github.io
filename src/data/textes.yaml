cv:
  competencesIntro: Rangées selon ma façon de travailler, de l'idée à la
    publication. Le chiffre renvoie aux publications où je les ai utilisées.
  savoirEtre:
    titre: Savoir-être
    texte: Calculés à partir des fiches de publication. Cliquer pour voir les
      publications concernées.
mentionsLegales:
  - titre: Éditrice du site
    texte: "Océane Bourdenet, journaliste. Contact : via le formulaire de contact de
      la page d'accueil."
  - titre: Hébergement
    texte: GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107,
      États-Unis.
  - titre: Contenus et droits
    texte: Les publications présentées appartiennent aux médias qui les ont
      diffusées. Chaque carte renvoie vers la publication d'origine. Les images
      d'aperçu restent la propriété de leurs auteurs.
  - titre: Données personnelles et cookies
    texte: Ce site ne dépose aucun cookie et n'utilise aucun outil de mesure
      d'audience. Les vidéos intégrées (Instagram, YouTube, TikTok) ne se
      chargent qu'au clic ; ces plateformes peuvent alors déposer leurs propres
      cookies. Les messages envoyés par le formulaire de contact servent
      uniquement à vous répondre.
