accueil:
  boutonPublications: Voir les publications
  medias: J'ai travaillé pour
  methode:
    titre: De l'idée à la publication
    sousTitre: en passant par le tournage et le montage
    intro: Sur chaque sujet, je fais tout, seule ou avec la rédaction.
    etapes:
      - titre: Le sujet et l'angle
        texte: Je repère les actualités sur les réseaux sociaux. Je contacte les
          primo-diffuseurs pour obtenir plus d’informations et en vérifier
          l’authenticité. Je recoupe les informations, puis je définis un angle.
        outils: X, TikTok, agences de presse, médias internationaux
      - titre: Les recherches (OSINT)
        texte: Je collecte des données issues de sources ouvertes (OSINT). J’utilise des
          outils pour retracer l’origine des textes, des fichiers audio et des
          images. Je fais également appel à des experts.
        outils: Telegram, X, Discord, outils IA (InVID, SynthID, etc.)
      - titre: Le script
        texte: Une fois mon sujet identifié et mes informations vérifiées, je passe à
          l’écriture du script. Je repère les images fortes, car ce sont elles
          qui vont structurer mon sujet et guider sa construction.
        outils: X, TikTok, Associated Press, AFP
      - titre: Les sources
        texte: Je recherche parfois des sources capables de lui apporter une dimension
          humaine.
        outils: TikTok, X, Instagram, Linkedin
      - titre: Le tournage
        texte: Je réalise mes tournages à la caméra ou au smartphone, selon les
          contraintes du terrain, en assurant également la prise de son.
        outils: Sony Alpha 7, Panasonic GH5, Kit Mojo
      - titre: Le montage
        texte: Je m’occupe du montage, de la collecte des images, du rythme, des
          sous-titres et de l’habillage.
        outils: Adobe Premiere Pro
      - titre: Le motion design
        texte: Cartes, chiffres et titres animés.
        outils: After Effects
  competencesCles:
    - OSINT et vérification
    - Tournage α7 · GH5
    - Montage Premiere Pro
    - Motion design After Effects
    - Référencement SEO
    - Journalisme mobile
    - Drone A1/A3
    - Data viz Flourish
  phares:
    titre: Publications phares
    intro: "Une sélection de vidéos et d'articles. Je réalise mes vidéos de A à Z :
      sujet, script, tournage, montage et motion design."
    lienTout: Voir toutes les publications
  chiffres:
    titre: En chiffres
    vues: vues cumulées sur Instagram
    likes: j'aime cumulés sur Instagram
    annees: ans d'expérience en rédaction
    redactions: rédactions, en France, au Liban et en Égypte
    note: Chiffres publics relevés en octobre 2026, uniquement pour les publications
      où l'affichage est activé.
  parcours:
    titre: Parcours en bref
    competencesCles: Compétences clés
    langues: Langues
    boutonCV: Voir le CV complet
  contact:
    titre: Contact
    intro: Pour un poste ou une pige, écrivez-moi avec ce formulaire. Je réponds
      sous quelques jours.
    bouton: Envoyer
    note: Votre adresse sert uniquement à vous répondre.
    noteInactif: Le formulaire sera actif une fois relié à Formspree.
    envoye: Merci, votre message est bien envoyé. Je vous réponds au plus vite.
    erreur: L’envoi n’a pas fonctionné. Vérifiez votre adresse e-mail et réessayez
      dans un instant.
    sujet: Nouveau message depuis le portfolio
publications:
