competences:
  phares:
    - titre: Enquête en sources ouvertes
      cle: osint
      texte: "Images satellites, géolocalisation, recoupements : je vérifie ce que
        montrent les images avant de les publier."
      exemple:
        titre: "Iran : les images satellites des sites nucléaires"
        url: https://www.instagram.com/reel/DYSfkk2s8gN/
    - titre: Motion design
      cle: motion
      texte: Cartes, chiffres et titres animés sur After Effects pour rendre un sujet
        lisible en quelques secondes.
      exemple:
        titre: "Mauritanie : le « train du désert »"
        url: https://www.instagram.com/reel/DSM2egujY-F/
    - titre: Tournage et montage
      cle: tournage
      texte: Caméra ou smartphone selon le terrain, puis un montage pensé pour le
        format vertical et le visionnage sans le son.
      exemple:
        titre: Les supporters après France-Espagne
        url: https://www.instagram.com/reel/DazpijzN3LA/
