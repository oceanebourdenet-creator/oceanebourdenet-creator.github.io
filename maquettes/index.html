<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes portfolio Océane Bourdenet</title>
<style>
  :root { color-scheme: light; --bg: #e9e6e8; --bar: #1d1a20; --bar-2: #2c2830; --fg: #f4f1f3; --muted: #aaa2ad; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  .bar { background: var(--bar); color: var(--fg); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; }
  .bar strong { font-weight: 600; }
  .group { display: flex; gap: 4px; background: var(--bar-2); padding: 3px; border-radius: 8px; }
  .group button { font: inherit; color: var(--muted); background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .group button[aria-pressed="true"] { background: var(--fg); color: var(--bar); font-weight: 600; }
  .group button:focus-visible, .sw:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .accents { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--bar); }
  .note { color: var(--muted); font-size: 12.5px; flex-basis: 100%; }
  .stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
  iframe { border: 0; background: #fff; display: block; }
  .stage.desktop iframe { width: 100%; height: 100%; }
  .stage.mobile { padding: 24px 16px; }
  .stage.mobile iframe { width: 390px; height: min(844px, calc(100% - 8px)); border-radius: 36px; border: 10px solid #111; box-shadow: 0 20px 50px rgb(0 0 0 / .25); flex: none; }
  @media (max-width: 700px) { .view { display: none; } .stage.mobile { padding: 0; } .stage.mobile iframe { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; } }
</style>
</head>
<body>
<header class="bar">
  <strong>Maquettes · Portfolio d'Océane Bourdenet</strong>
  <div class="group" role="group" aria-label="Page">
    <button type="button" data-page="accueil" aria-pressed="true">Accueil</button>
    <button type="button" data-page="publications" aria-pressed="false">Publications</button>
    <button type="button" data-page="cv" aria-pressed="false">CV</button>
  </div>
  <div class="group view" role="group" aria-label="Affichage">
    <button type="button" data-view="desktop" aria-pressed="true">Bureau</button>
    <button type="button" data-view="mobile" aria-pressed="false">Mobile</button>
  </div>
  <div class="accents" role="group" aria-label="Couleur d'accent">Accent
    <button class="sw" type="button" data-accent="framboise" style="background:#a3324f" aria-label="Framboise" aria-pressed="true"></button>
    <button class="sw" type="button" data-accent="encre" style="background:#1f4a8a" aria-label="Bleu encre" aria-pressed="false"></button>
    <button class="sw" type="button" data-accent="foret" style="background:#2d6a4f" aria-label="Vert forêt" aria-pressed="false"></button>
  </div>
  <p class="note">Publications réelles d'Océane. Les titres et les compétences associées sont des propositions à valider. Chiffres : j'aime et vues publics, relevés en octobre 2026.</p>
</header>
<main class="stage desktop" id="stage">
  <iframe id="frame" title="Aperçu de la maquette" src="accueil.html"></iframe>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const s = { page: q.get("page") || "accueil", view: q.get("view") || "desktop", accent: q.get("accent") || "framboise" };
  const frame = document.getElementById("frame"), stage = document.getElementById("stage");
  function go(reload) {
    document.querySelectorAll("[data-page]").forEach(b => b.setAttribute("aria-pressed", b.dataset.page === s.page));
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === s.view));
    document.querySelectorAll("[data-accent]").forEach(b => b.setAttribute("aria-pressed", b.dataset.accent === s.accent));
    stage.className = "stage " + s.view;
    if (reload) frame.src = `${s.page}.html?accent=${s.accent}`;
  }
  document.querySelector(".bar").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.page) { s.page = b.dataset.page; go(true); }
    if (b.dataset.view) { s.view = b.dataset.view; go(false); }
    if (b.dataset.accent) { s.accent = b.dataset.accent; go(true); }
  });
  // Suit la navigation faite à l'intérieur de la maquette
  frame.addEventListener("load", () => {
    try { const p = frame.contentWindow.location.pathname.split("/").pop().replace(".html", ""); if (p) { s.page = p; go(false); } } catch {}
  });
  go(true);
</script>
</body>
</html>
