# Configuration de Pages CMS (app.pagescms.org).
# Fichier généré par « npm run cms » à partir de src/config : ne pas le modifier à la main.
media:
  - name: "publications"
    label: "Images des publications"
    input: "src/assets/publications"
    output: "/publications"
    categories: ["image"]
    rename: "safe"
  - name: "logos"
    label: "Logos"
    input: "src/assets/logos"
    output: "/logos"
    categories: ["image"]
    rename: "safe"
content:
  - name: "publications"
    label: "Publications"
    type: "collection"
    path: "src/content/publications"
    format: "yaml"
    exclude: ["_modele.yaml"]
    filename:
      template: "{date}-{titre}.yaml"
      field: "create"
    view:
      primary: "titre"
      fields: ["titre", "media", "date", "categorie"]
    fields:
      - name: "titre"
        label: "Titre"
        type: "string"
        required: true
      - name: "media"
        label: "Média"
        type: "string"
        required: true
        description: "Nom du média, écrit comme dans le CV (ex. TV5MONDE, France-Antilles)."
      - name: "date"
        label: "Date de publication"
        type: "date"
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: "url"
        label: "Lien de la publication"
        type: "string"
        required: true
        description: "Adresse complète de la publication d’origine (https://…)."
      - name: "categorie"
        label: "Catégorie"
        type: "select"
        required: true
        options:
          values:
            - name: "enquetes-osint"
              label: "Enquêtes OSINT"
            - name: "tendances"
              label: "Tendances"
            - name: "reportages"
              label: "Reportages"
            - name: "mini-documentaires"
              label: "Mini-documentaires"
            - name: "temoignages"
              label: "Témoignages"
      - name: "format"
        label: "Format"
        type: "select"
        required: true
        options:
          values:
            - name: "video"
              label: "Vidéo"
            - name: "article"
              label: "Article"
            - name: "podcast"
              label: "Podcast"
            - name: "reportage"
              label: "Reportage"
            - name: "enquete"
              label: "Enquête"
            - name: "interview"
              label: "Interview"
            - name: "autre"
              label: "Autre"
      - name: "accroche"
        label: "Accroche"
        type: "text"
        required: true
        description: "1 à 2 phrases écrites par vous, pas le chapô du média."
      - name: "coulisses"
        label: "Les coulisses"
        type: "text"
        description: "Ce que vous avez fait pour réaliser le sujet, à la première personne. Pour une liste, commencer chaque ligne par « - »."
      - name: "image"
        label: "Image d’aperçu"
        type: "image"
        options:
          media: "publications"
        description: "1200 px de large maximum et moins de 200 Ko. Sans image, un visuel de remplacement est affiché."
      - name: "plateforme"
        label: "Plateforme (vidéos)"
        type: "select"
        options:
          values:
            - name: "instagram"
              label: "Instagram"
            - name: "tiktok"
              label: "TikTok"
            - name: "youtube"
              label: "YouTube"
            - name: "facebook"
              label: "Facebook"
            - name: "x"
              label: "X"
            - name: "autre"
              label: "Autre"
      - name: "embed"
        label: "Identifiant de la vidéo"
        type: "string"
        description: "Pour afficher la vidéo sur le site. Instagram : le code après /p/ ou /reel/ dans le lien (ex. Dc3_k3gN5kT). YouTube : le code après v= ou /shorts/."
      - name: "vertical"
        label: "Vidéo verticale (Short YouTube)"
        type: "boolean"
      - name: "duree"
        label: "Durée"
        type: "string"
        description: "Ex. « 1 min 36 ». Facultatif."
      - name: "collaboration"
        label: "Publication Instagram en collaboration"
        type: "boolean"
        description: "À cocher si la publication est partagée entre plusieurs comptes."
      - name: "serie"
        label: "Série"
        type: "string"
        description: "Pour regrouper plusieurs vidéos d’un même événement : nom du fichier de la série, sans .yaml (ex. tour-des-yoles-2026)."
      - name: "phare"
        label: "Position dans les publications phares"
        type: "number"
        description: "1 = première carte de l’accueil. Laisser vide pour ne pas mettre en avant."
      - name: "role"
        label: "Mon rôle"
        type: "string"
        description: "Seulement si différent de « sujet, script, tournage, montage et motion design »."
      - name: "competences"
        label: "Compétences mobilisées"
        type: "object"
        fields:
          - name: "techniques"
            label: "Compétences techniques"
            type: "select"
            options:
              values:
                - name: "osint"
                  label: "OSINT"
                - name: "satellite"
                  label: "Images satellites"
                - name: "donnees"
                  label: "Collecte de données"
                - name: "archives"
                  label: "Recherche d'archives"
                - name: "carto"
                  label: "Cartographie"
                - name: "verif"
                  label: "Vérification d'images"
                - name: "geoloc"
                  label: "Géolocalisation"
                - name: "tournage"
                  label: "Tournage"
                - name: "mojo"
                  label: "Mojo"
                - name: "montage"
                  label: "Montage Premiere Pro"
                - name: "soustitrage"
                  label: "Sous-titrage"
                - name: "interview"
                  label: "Interview"
                - name: "anglais"
                  label: "Anglais"
                - name: "arabe"
                  label: "Arabe"
                - name: "dataviz"
                  label: "Data visualisation"
                - name: "ecriture"
                  label: "Écriture web"
                - name: "seo"
                  label: "Référencement SEO"
                - name: "script"
                  label: "Script vidéo"
                - name: "motion"
                  label: "Motion design After Effects"
                - name: "incarnation"
                  label: "Incarnation face caméra"
                - name: "photoshop"
                  label: "Photoshop"
              multiple: true
          - name: "humaines"
            label: "Compétences humaines"
            type: "select"
            options:
              values:
                - name: "rigueur"
                  label: "Rigueur"
                - name: "tenacite"
                  label: "Ténacité"
                - name: "pedagogie"
                  label: "Pédagogie"
                - name: "synthese"
                  label: "Esprit de synthèse"
                - name: "reactivite"
                  label: "Réactivité"
                - name: "humour"
                  label: "Sens de l'humour"
                - name: "aisance"
                  label: "Aisance relationnelle"
                - name: "ecoute"
                  label: "Écoute"
                - name: "empathie"
                  label: "Empathie"
                - name: "confiance"
                  label: "Mise en confiance"
                - name: "curiosite"
                  label: "Curiosité"
                - name: "adaptabilite"
                  label: "Adaptabilité"
                - name: "organisation"
                  label: "Organisation"
                - name: "sangfroid"
                  label: "Sang-froid"
              multiple: true
      - name: "afficherChiffres"
        label: "Afficher les chiffres sur la carte"
        type: "boolean"
      - name: "vues"
        label: "Vues"
        type: "number"
      - name: "likes"
        label: "J’aime"
        type: "number"
      - name: "commentaires"
        label: "Commentaires"
        type: "number"
      - name: "partages"
        label: "Partages"
        type: "number"
      - name: "dateChiffres"
        label: "Date du relevé des chiffres"
        type: "date"
        options:
          format: "yyyy-MM-dd"
        description: "Obligatoire dès qu’un chiffre est renseigné."
      - name: "sourceChiffres"
        label: "Source des chiffres"
        type: "select"
        options:
          values:
            - name: "public"
              label: "Relevés sur la plateforme"
            - name: "media"
              label: "Statistiques du média"
      - name: "archive"
        label: "Lien archivé (secours)"
        type: "string"
        description: "Copie de la Wayback Machine, utilisée si le lien d’origine ne marche plus."
      - name: "lienMort"
        label: "Le lien d’origine ne fonctionne plus"
        type: "boolean"
  - name: "series"
    label: "Séries de vidéos"
    type: "collection"
    path: "src/content/series"
    format: "yaml"
    filename:
      template: "{titre}.yaml"
