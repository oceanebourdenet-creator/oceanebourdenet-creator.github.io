            - name: "temoignages"
              label: "Témoignages"
      - name: "accroche"
        label: "Accroche"
        type: "text"
        required: true
      - name: "coulisses"
        label: "Les coulisses"
        type: "text"
      - name: "phare"
        label: "Position dans les publications phares"
        type: "number"
  - name: "cv"
    label: "CV"
    type: "file"
    path: "src/data/cv.yaml"
    format: "yaml"
    fields:
      - name: "profil"
        label: "Profil"
        type: "object"
        fields:
          - name: "nom"
            label: "Nom"
            type: "string"
            required: true
          - name: "titre"
            label: "Titre"
            type: "string"
            required: true
          - name: "ville"
            label: "Ville"
            type: "string"
            required: true
          - name: "accroche"
            label: "Accroche de l’accueil"
            type: "text"
            required: true
          - name: "resume"
            label: "Résumé du CV"
            type: "text"
            required: true
          - name: "reseaux"
            label: "Réseaux"
            type: "object"
            list: true
            fields:
              - name: "nom"
                label: "Nom"
                type: "string"
              - name: "url"
                label: "Lien"
                type: "string"
      - name: "experiences"
        label: "Expériences"
        type: "object"
        list:
          collapsible:
            collapsed: true
            summary: "{media} · {poste}"
        fields:
          - name: "media"
            label: "Média"
            type: "string"
            required: true
          - name: "logo"
            label: "Logo"
            type: "image"
            options:
              media: "logos"
          - name: "pageAuteur"
            label: "Page auteur sur le site du média"
            type: "string"
          - name: "poste"
            label: "Poste"
            type: "string"
            required: true
          - name: "type"
            label: "Type (CDD, stage, alternance…)"
            type: "string"
            required: true
          - name: "lieu"
            label: "Lieu"
            type: "string"
            required: true
          - name: "debut"
            label: "Début"
            type: "string"
            required: true
            description: "Format AAAA-MM, ex. 2025-09."
          - name: "fin"
            label: "Fin"
            type: "string"
            required: true
            description: "Format AAAA-MM, ou « aujourd'hui »."
          - name: "description"
            label: "Description"
            type: "text"
      - name: "formations"
